name: Deploy CRM Staging

on:
  push:
    branches: ["crm"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Auto Version Tagging
        id: tag
        run: |
          TAG="staging-$(date +"%Y%m%d-%H%M%S")"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 (Blue-Green)
        run: |
          ssh ${{ secrets.EC2_STAGING_USER }}@${{ secrets.EC2_STAGING_HOST }} << 'EOF'
            set -e

            BASE=/home/ubuntu/Backend-NodeJS-2025

            echo "---- Detecting CURRENT live environment ----"
            if [ "$(readlink $BASE/current)" = "$BASE/blue" ]; then
              TARGET="green"
              LIVE="blue"
            else
              TARGET="blue"
              LIVE="green"
            fi

            echo "Live: $LIVE"
            echo "Deploying to: $TARGET"

            DEPLOY_DIR="$BASE/$TARGET"

            echo "---- Saving previous commit for rollback ----"
            PREV=$(git -C $BASE/$LIVE rev-parse HEAD)

            echo "---- Updating code in $TARGET ----"
            git -C $DEPLOY_DIR fetch origin crm
            git -C $DEPLOY_DIR reset --hard origin/crm

            echo "---- Applying environment (.env.staging) ----"
            cp $BASE/.env.staging $DEPLOY_DIR/.env

            echo "---- Installing dependencies ----"
            npm --prefix $DEPLOY_DIR install --production

            echo "---- Restarting PM2 process for $TARGET ----"
            pm2 restart crms-api-staging-$TARGET || pm2 start $DEPLOY_DIR/server.js --name crms-api-staging-$TARGET

            echo "---- Running health checks ----"
            for i in {1..5}; do
              STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://crms-api-dev.duckdns.org/api/v1/utility/health)
              echo "Attempt $i: $STATUS"
              [ "$STATUS" = "200" ] && break
              sleep 5
            done

            if [ "$STATUS" != "200" ]; then
              echo "❌ Health check failed — rolling back to $LIVE"
              git -C $DEPLOY_DIR reset --hard $PREV
              pm2 restart crms-api-staging-$LIVE
              exit 1
            fi

            echo "---- Health OK — switching symlink to $TARGET ----"
            ln -sfn $DEPLOY_DIR $BASE/current

            echo "---- Reloading Nginx if installed ----"
            sudo systemctl reload nginx || true

            echo "🎉 Blue–Green Deployment SUCCESS ($TARGET is now LIVE) ----"
          EOF

