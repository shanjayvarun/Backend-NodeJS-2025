name: Deploy CRM Staging

on:
  push:
    branches: ["crm"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure SSH so the runner can connect to EC2
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 3. Deployment commands run inside EC2
      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "---- Navigating to project directory ----"
            cd /home/ubuntu/Backend-NodeJS-2025

            echo "---- Pulling latest code from crm branch ----"
            git fetch origin crm
            git reset --hard origin/crm

            echo "---- Applying staging environment variables ----"
            .env.staging

            echo "---- Installing dependencies ----"
            npm install

            echo "---- Reloading PM2 process (zero downtime) ----"
            pm2 reload crms-api-staging --update-env

            echo "---- Deployment finished successfully ----"
          EOF
