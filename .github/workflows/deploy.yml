name: Deploy to EC2

on:
  push:
    branches: ["crm"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Configure SSH
        run: |
          printf "Host ec2\n" > ~/.ssh/config
          printf "  HostName %s\n" "${{ secrets.EC2_HOST }}" >> ~/.ssh/config
          printf "  User %s\n" "${{ secrets.EC2_USER }}" >> ~/.ssh/config
          printf "  IdentityFile ~/.ssh/deploy_key\n" >> ~/.ssh/config
          printf "  StrictHostKeyChecking no\n" >> ~/.ssh/config

      - name: Run Deployment Script
        run: ssh ec2 "bash /home/ubuntu/deploy.sh"
