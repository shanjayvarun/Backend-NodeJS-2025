name: Infrastructure and App Deployment

on:
  push:
    branches: [crm-microservices]

jobs:
  terraform:
    name: "Infrastructure (Terraform)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    outputs:
      ec2_public_ip: ${{ steps.set-ip.outputs.ip }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION}}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Select Workspace
        run: |
          terraform init
          terraform workspace select dev || terraform workspace new dev

      - name: Terraform Validate and Formating
        run: |
          terraform validate
          terraform fmt -check
          echo "Terraform configuration is valid and properly formatted."

      - name: Create tfvars file
        run: |
          mkdir -p tfvars
          # This 'cat' method preserves newlines and formatting perfectly
          cat <<EOF > tfvars/dev.tfvars
          ${{ secrets.DEV_TFVARS }}
          EOF

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -var-file="./tfvars/dev.tfvars"

      - name: Get EC2 IP
        id: set-ip
        run: echo "ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT

  deploy-app:
    name: "Application (SSH)"
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.terraform.outputs.ec2_public_ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deploying to dynamic IP: ${{ needs.terraform.outputs.ec2_public_ip }}"
            # 1. Wait for User Data to finish installing Git and Docker
            echo "Waiting for system setup to complete..."
            until [ -f /var/lib/cloud/instance/boot-finished ]; do
              sleep 5
            done
            echo "System setup finished. Starting deployment..."

            # 2. Prepare Project Directory
            mkdir -p /home/ec2-user/crms-backend
            cd /home/ec2-user/crms-backend

            # 3. Clone or Update Repository
            if [ ! -d ".git" ]; then
              git clone -b crm-microservices https://github.com/shanjayvarun/crms-backend.git .
            else
              git fetch origin
              git checkout crm-microservices
              git reset --hard origin/crm-microservices
            fi

            # 4. Create Service Folders and Inject ENV Secrets
            # We use quoted 'EOF' to prevent the shell from mangling special characters in passwords
            mkdir -p services/auth-service
            mkdir -p services/user-service

            cat <<'EOF' > services/auth-service/.env.prod
            ${{ secrets.AUTH_SERVICE_ENV }}
            EOF

            cat <<'EOF' > services/user-service/.env.prod
            ${{ secrets.USER_SERVICE_ENV }}
            EOF

            # 5. Verify Files Exist (For logs)
            echo "Checking deployment files..."
            ls -la services/auth-service/.env.prod
            ls -la services/user-service/.env.prod

            # 6. Docker Deployment
            # Using sudo ensures we don't hit permission errors before the group change takes effect
            sudo docker system prune -af --volumes
            sudo docker compose up -d --build
            sudo docker image prune -f
            echo "Docker deployment cleaned up."
            echo "Deployment complete on IP: ${{ needs.terraform.outputs.ec2_public_ip }}"
