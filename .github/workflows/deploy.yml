name: Deploy CRMS to AWS

on:
  push:
    branches: [ crm-microservices ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            # 1. WAIT for the server to finish its own setup (User Data)
            echo "Waiting for system setup to complete..."
            until [ -f /var/lib/cloud/instance/boot-finished ]; do
              sleep 5
            done
            echo "System setup finished. Starting deployment..."

            # 2. Create project directory
            mkdir -p /home/ec2-user/crms-backend
            cd /home/ec2-user/crms-backend

            # 3. Clone or pull (Git should be ready now)
            if [ ! -d ".git" ]; then
              git clone -b crm-microservices https://github.com/shanjayvarun/crms-backend.git .
            else
              git fetch origin
              git checkout crm-microservices
              git reset --hard origin/crm-microservices
            fi

            # ... [Rest of your ENV setup] ...

            # 4. Docker Deploy (Using sudo just in case the group change hasn't refreshed)
            sudo docker compose up -d --build
