name: Deploy CRMS to AWS
on:
  push:
    branches: [ crm-microservices ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/crms-backend
            
            # 1. Pull latest code
            if [ ! -d ".git" ]; then
              git clone -b crm-microservices https://github.com/shanjayvarun/crms-backend.git .
            else
              git fetch origin
              git checkout crm-microservices
              git pull origin crm-microservices
            fi

            # 2. INJECT ALL SECRETS
            # Auth Service
            mkdir -p services/auth-service
            cat <<EOF > services/auth-service/.env.prod
            ${{ secrets.AUTH_SERVICE_ENV }}
            EOF

            # User Service
            mkdir -p services/user-service
            cat <<EOF > services/user-service/.env.prod
            ${{ secrets.USER_SERVICE_ENV }}
            EOF

            # 3. VERIFY BOTH (Skeptical Check)
            ls -la services/auth-service/.env.prod
            ls -la services/user-service/.env.prod

            # 4. Start Docker
            docker compose up -d --build