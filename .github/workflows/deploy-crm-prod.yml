name: Deploy CRM Production

on:
  push:
    branches: ["crm-prod"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "---- Navigating to project directory ----"
            cd /home/ubuntu/Backend-NodeJS-2025

            echo "---- Pulling latest code from crm branch ----"
            git fetch origin crm-prod
            git reset --hard origin/crm-prod

            echo "---- Applying production environment variables ----"
            cp .env .env

            echo "---- Installing dependencies ----"
            npm install --production

            echo "---- Reloading PM2 process (zero downtime) ----"
            pm2 reload crm-api --update-env

            echo "---- Deployment finished successfully ----"
          EOF
