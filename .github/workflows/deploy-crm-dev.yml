name: Deploy CRM Dev

on:
  push:
    branches: ["crm-dev"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Git Tag
        run: |
          TIMESTAMP=$(date +"%Y.%m.%d-%H%M")
          TAG="dev-${TIMESTAMP}"

          echo "Creating tag: $TAG"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Git Update CRM DEV Branch
        run: |
          ssh ${{ secrets.EC2_STAGING_USER }}@${{ secrets.EC2_STAGING_HOST }} << 'EOF'
            cd /home/ubuntu/crms-backend
            PREV_COMMIT=$(git rev-parse HEAD)
            git fetch origin crm-dev
            git reset --hard origin/crm-dev
            echo "$PREV_COMMIT" > PREV_COMMIT_FILE
          EOF

      - name: Apply Dev Environment Variables
        run: |
          ssh ${{ secrets.EC2_STAGING_USER }}@${{ secrets.EC2_STAGING_HOST }} << 'EOF'
            cd /home/ubuntu/crms-backend
            cp .env.dev .env
          EOF

      - name: Install Dependencies
        run: |
          ssh ${{ secrets.EC2_STAGING_USER }}@${{ secrets.EC2_STAGING_HOST }} << 'EOF'
            cd /home/ubuntu/crms-backend
            npm install --dev
          EOF

      - name: Reload PM2 Process
        run: |
          ssh ${{ secrets.EC2_STAGING_USER }}@${{ secrets.EC2_STAGING_HOST }} << 'EOF'
            cd /home/ubuntu/crms-backend
            pm2 reload crms-dev --update-env
          EOF

      - name: Health Check API
        id: health
        run: |
          ssh ${{ secrets.EC2_STAGING_USER }}@${{ secrets.EC2_STAGING_HOST }} << 'EOF'
            cd /home/ubuntu/crms-backend

            STATUS=0
            for i in {1..5}; do
              STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://crms-api-dev.duckdns.org/v2/utility/health)
              echo "Health Try $i: $STATUS"
              [ "$STATUS" = "200" ] && break
              sleep 5
            done

            echo $STATUS > HEALTH_STATUS_FILE
          EOF

      - name: Rollback on Failure
        if: always()
        run: |
          HEALTH=$(ssh ${{ secrets.EC2_STAGING_USER }}@${{ secrets.EC2_STAGING_HOST }} "cat /home/ubuntu/crms-backend/HEALTH_STATUS_FILE")

          if [ "$HEALTH" != "200" ]; then
            echo "❌ Health check failed — rolling back..."
            ssh ${{ secrets.EC2_STAGING_USER }}@${{ secrets.EC2_STAGING_HOST }} << 'EOF'
              cd /home/ubuntu/crms-backend
              PREV_COMMIT=$(cat PREV_COMMIT_FILE)
              git reset --hard "$PREV_COMMIT"
              npm install --dev
              pm2 restart crms-dev --update-env
            EOF
            exit 1
          fi

      - name: Deployment Successful
        if: success()
        run: echo "🎉 CRM Dev Deployment Completed Successfully!"
